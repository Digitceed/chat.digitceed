name: Build Digitceed AI (Windows installer)

# Builds the Windows installer of Digitceed AI and keeps it as a download on
# the run page (Actions, this run, Artifacts). Nothing is published and nothing
# is code signed.
#
# The steps are the Windows lane of the original project's release workflow,
# reduced to what an unsigned build needs: the bundled llama.cpp engine is built
# from source first (tauri build stops on a missing externalBin), then the app.
# The first run compiles llama.cpp and the Rust crate from nothing and takes
# roughly an hour; later runs reuse both caches.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  # Vulkan SDK for the Vulkan build of the engine. Version and checksum are
  # the ones the original release workflow pins; change them together.
  VULKAN_SDK_VERSION: '1.4.313.2'
  VULKAN_SDK_SHA256: '34a921d951858274ca8e470e9d0a3b7624db41216b3908ccea9f73c8a1b7500e'
  SIDECAR_TRIPLE: x86_64-pc-windows-msvc

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Rust cache
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: './src-tauri -> target'

      # ── llama.cpp engine ─────────────────────────────────────────────────
      - name: Engine build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          # Must match LLAMA_BUILD_CACHE below.
          path: D:/lb
          key: llama-${{ hashFiles('scripts/build-llama.sh', 'scripts/llama-patches/**') }}-${{ env.SIDECAR_TRIPLE }}-v1

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          curl.exe -fL --retry 3 -o "$env:RUNNER_TEMP\VulkanSDK-Installer.exe" `
            "https://sdk.lunarg.com/sdk/download/${env:VULKAN_SDK_VERSION}/windows/vulkansdk-windows-X64-${env:VULKAN_SDK_VERSION}.exe"
          if ($LASTEXITCODE -ne 0) { throw "Vulkan SDK download failed" }
          $got = (Get-FileHash -Algorithm SHA256 "$env:RUNNER_TEMP\VulkanSDK-Installer.exe").Hash.ToLower()
          if ($got -ne $env:VULKAN_SDK_SHA256) { throw "Vulkan SDK installer has sha256 $got, expected $env:VULKAN_SDK_SHA256. It was not run." }
          & "$env:RUNNER_TEMP\VulkanSDK-Installer.exe" --accept-licenses --default-answer --confirm-command install
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=C:\VulkanSDK\${env:VULKAN_SDK_VERSION}"

      - name: Build the engine (llama-server)
        shell: bash
        env:
          BUILD_JOBS: 2
          # A short build root: the Vulkan shader build nests paths past
          # Windows' 260 character limit under the workspace.
          LLAMA_BUILD_CACHE: 'D:/lb'
        run: bash scripts/build-llama.sh "$SIDECAR_TRIPLE"

      - name: Check the engine files exist
        shell: bash
        run: |
          test -f "src-tauri/bin/lu-llama-server-$SIDECAR_TRIPLE.exe"
          test -f "src-tauri/bin/lu-llama-cvector-generator-$SIDECAR_TRIPLE.exe"
          ls -la src-tauri/bin/ "src-tauri/resources/llama/$SIDECAR_TRIPLE"

      # ── App ──────────────────────────────────────────────────────────────
      - name: Install npm dependencies
        run: npm ci

      - name: Build the installer
        run: npx tauri build --bundles nsis

      - name: Keep the installer
        uses: actions/upload-artifact@v4
        with:
          name: Digitceed-AI-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
